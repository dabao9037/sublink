<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · SubLink</title>
  <style>
    :root{--ink:#10120f;--green:#153d2c;--acid:#c9ff35;--paper:#f3f2ec;--muted:#73776e;--line:#d9d8cf}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
    body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:-1}body:before{width:540px;height:540px;right:-220px;top:-260px;background:#dcff7b}body:after{width:430px;height:430px;left:-250px;bottom:-230px;background:#ffd6c5}
    .page{width:min(980px,calc(100% - 28px));display:grid;grid-template-columns:1.1fr .9fr;background:#fbfaf5;border:1px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:12px 12px 0 var(--ink)}
    .intro{padding:58px;background:var(--green);color:#fff;display:flex;flex-direction:column;min-height:570px}.brand{font-size:13px;letter-spacing:.18em;display:flex;align-items:center;gap:10px}.brand b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--acid);color:var(--ink)}
    .intro h1{font-size:64px;line-height:.96;letter-spacing:-.06em;margin:auto 0 20px}.intro h1 span{color:var(--acid)}.intro p{color:#c8d2cc;line-height:1.8;margin:0;max-width:400px}.chips{display:flex;gap:7px;margin-top:30px;flex-wrap:wrap}.chips span{font-size:10px;letter-spacing:.08em;border:1px solid #ffffff35;border-radius:20px;padding:7px 10px}
    .login{padding:58px 48px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green);font-weight:800}.login h2{font-size:36px;letter-spacing:-.04em;margin:10px 0 8px}.hint{color:var(--muted);font-size:14px;margin:0 0 34px;line-height:1.7}.field{margin-bottom:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.input{position:relative}.input input{width:100%;height:54px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;font-size:15px;outline:none}.input input:focus{border-color:var(--green);box-shadow:0 0 0 3px #153d2c12}.toggle{position:absolute;right:10px;top:9px;height:36px;border:0;background:transparent;color:var(--muted);cursor:pointer}
    .error{background:#ffe5dc;color:#9b2d0d;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:16px}.submit{height:54px;width:100%;border:1px solid var(--ink);border-radius:12px;background:var(--acid);font-weight:900;font-size:15px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:.18s}.submit:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}.footer{font-size:11px;color:var(--muted);text-align:center;margin-top:24px}
    @media(max-width:760px){body{overflow:auto;padding:18px 0}.page{grid-template-columns:1fr;box-shadow:7px 7px 0 var(--ink)}.intro{min-height:auto;padding:30px}.intro h1{font-size:43px;margin:55px 0 16px}.intro p{font-size:13px}.login{padding:36px 24px}.login h2{font-size:31px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="intro">
      <div class="brand"><b>S</b><strong>SUBLINK</strong></div>
      <h1>多个节点，<br><span>一个订阅。</span></h1>
      <p>私有部署的节点聚合与订阅管理工具。登录后即可创建、编辑和管理你的订阅。</p>
      <div class="chips"><span>VLESS</span><span>VMESS</span><span>TROJAN</span><span>SHADOWSOCKS</span></div>
    </section>
    <section class="login">
      <div class="eyebrow">ADMIN CONSOLE</div>
      <h2>欢迎回来</h2>
      <p class="hint">使用安装脚本生成的后台账号和密码登录。</p>
      {error}
      <form method="post" action="/login" autocomplete="on">
        <div class="field"><label for="username">用户名</label><div class="input"><input id="username" name="username" required autocomplete="username" autofocus></div></div>
        <div class="field"><label for="password">密码</label><div class="input"><input id="password" name="password" type="password" required autocomplete="current-password"><button class="toggle" type="button" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'显示':'隐藏'">显示</button></div></div>
        <button class="submit" type="submit">登录后台 →</button>
      </form>
      <div class="footer">SubLink · Self Hosted Subscription Tool</div>
    </section>
  </main>
</body>
</html>
